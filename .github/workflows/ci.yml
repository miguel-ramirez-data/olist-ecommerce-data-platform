name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: SQLFluff
        run: sqlfluff lint infra/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olist
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      PGPASSWORD: olist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Apply database init scripts
        run: |
          for f in infra/postgres/init/*.sql; do
            psql -h localhost -U olist -d olist -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run tests
        run: pytest -v
